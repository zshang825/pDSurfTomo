[project]
name = "pdsurftomo"
version = "0.1.0"
description = "a high-performance parallel computing package for Direct Surface Wave Tomography"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alphashape>=1.3.1",
    "matplotlib>=3.10.8",
    "numba>=0.65.0",
    "cupy-cuda12x>=14.0.1",
    "paramiko>=4.0.0",
    "pyqt-fluent-widgets[full]>=1.11.2",
    "pyqt5-qt5==5.15.2",
]

# Dependency Override: Pin NumPy and SciPy versions to maintain
# API compatibility with cupy-cuda12x requirements.
[tool.uv]
override-dependencies = [
    "numpy==2.1.0",
    "scipy==1.14.0"
]

[[tool.uv.index]]
name = "pypi-official"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
PyQt-Fluent-Widgets = { index = "pypi-official" }


